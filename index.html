<section
    class="secao-tabela"
    aria-label="Encerrado COE - Repetidas"
>
    <div class="cabecalho-tabela">
        <div>
            <h2>Encerrado COE - Repetidas</h2>

            <p
                id="mensagemDados"
                class="mensagem-dados"
                hidden
            ></p>
        </div>

        <div class="resumo-acoes-tabela">
            <span id="totalTabelaEncerrado">
                0 casos • 0,0%
            </span>

            <button
                type="button"
                id="btnExportarEncerrado"
                class="botao-exportar"
                title="Exportar os registros filtrados para Excel"
            >
                Exportar para Excel
            </button>
        </div>
    </div>

    <div class="tabela-scroll">
        <table
            id="tabelaEncerrado"
            class="tabela-encerrado"
        >
            <thead>
                <tr>
                    <th scope="col">COD_SS</th>

                    <th scope="col">
                        TELEPHONIC_AREA
                    </th>

                    <th scope="col">TESTE</th>

                    <th scope="col">
                        SUB STATUS
                    </th>

                    <th scope="col">
                        REPETIDA
                    </th>

                    <th scope="col">AGING</th>
                </tr>
            </thead>

            <tbody id="corpoTabelaEncerrado">
                <tr>
                    <td
                        colspan="6"
                        class="sem-registros"
                    >
                        Carregando...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</section>
