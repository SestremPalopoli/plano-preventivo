<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtividade dos Gestores</title>
    <link rel="stylesheet" href="style.css">

    <!-- Ajuste exclusivo da altura das linhas das tabelas -->
    <style>
        .tabela-indicador th {
            height: 27px;
            padding-top: 4px;
            padding-bottom: 4px;
        }

        .tabela-indicador td {
            height: 29px;
            padding-top: 4px;
            padding-bottom: 4px;
        }

        /* Botão de acesso ao painel Icomon */
        .btn-painel-icomon {
            width: 230px;
            height: 42px;
            padding: 0 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            background: linear-gradient(90deg, #5b1fa6, #7a3fe0);
            border: 2px solid #5b1fa6;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-painel-icomon:hover {
            background: linear-gradient(90deg, #2e0a5e, #5b1fa6);
            border-color: #2e0a5e;
            transform: translateY(-1px);
        }

        .btn-painel-icomon:focus {
            outline: none;
            box-shadow: 0 0 0 4px rgba(122, 63, 224, 0.18);
        }

        @media (max-width: 840px) {
            .btn-painel-icomon {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header class="cabecalho">
        <div class="logo">
            <img src="logo-vivo.png" alt="Logo Vivo">
        </div>

        <div class="titulo">
            <h1>Produtividade dos Gestores</h1>
            <p>Acompanhamento Operacional</p>
        </div>

        <div class="data">
            Atualizado em<br>
            <span id="data-atualizacao">Carregando...</span>
        </div>
    </header>

    <main>
        <section class="filtros-container" aria-label="Filtros do painel">
            <div class="filtro-group">
                <label for="mesSelecionado">Selecione o mês</label>
                <select id="mesSelecionado">
                    <option value="0">Todos</option>
                    <option value="1">Janeiro</option>
                    <option value="2">Fevereiro</option>
                    <option value="3">Março</option>
                    <option value="4">Abril</option>
                    <option value="5">Maio</option>
                    <option value="6">Junho</option>
                    <option value="7">Julho</option>
                    <option value="8">Agosto</option>
                    <option value="9">Setembro</option>
                    <option value="10" selected>Outubro</option>
                    <option value="11">Novembro</option>
                    <option value="12">Dezembro</option>
                </select>
            </div>

            <div class="filtro-group">
                <label for="filtroData">Selecione a data</label>
                <select id="filtroData"></select>
            </div>

            <div class="filtro-group">
                <label for="filtroGestor">Selecione o gestor</label>
                <select id="filtroGestor">
                    <option value="">Selecione...</option>
                </select>
            </div>

            <div class="filtro-group">
                <label for="btnFullscreen">Tela cheia</label>
                <button
                    id="btnFullscreen"
                    class="btn-filtro"
                    type="button"
                    title="Alternar tela cheia"
                >
                    🖥️
                </button>
            </div>

            <div class="filtro-group">
                <label for="btnPainelIcomon">Painéis</label>
                <a
                    id="btnPainelIcomon"
                    class="btn-painel-icomon"
                    href="rit-icomon.html"
                    target="_blank"
                    rel="noopener noreferrer"
                    title="Abrir o painel Lançamento de RIT - Icomon"
                >
                    Lançamento de RIT - Icomon
                </a>
            </div>
        </section>

        <section
            id="cardsIndicadores"
            class="cards"
            aria-label="Totais dos indicadores"
        ></section>

        <section
            id="gradePaineis"
            class="grade-paineis"
            aria-label="Indicadores por gestor"
        ></section>
    </main>

    <div id="mensagemErro" class="mensagem-erro" hidden></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
